global: {scrape_interval: 15s, evaluation_interval: 15s}
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: todoh
    metrics_path: /metrics
    authorization: {type: Bearer, credentials_file: /etc/prometheus/owner_token}  # the owner token: /metrics answers 404 to anyone else
    static_configs: [{targets: ["todoh:8000"]}]
