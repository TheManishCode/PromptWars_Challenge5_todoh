# App + Prometheus + Grafana on one host. Put a TLS-terminating proxy (Caddy, nginx, a cloud load balancer) in front of "todoh"; docs/HOSTING.md says what it must forward.
# Usage: cp deploy/env.example deploy/.env && edit it; echo -n "$OWNER_TOKEN" > deploy/prometheus/owner_token; docker compose -f deploy/docker-compose.yml up -d --build
name: todoh  # a fixed project name: the folder name ("deploy") would collide with any other stack kept in a folder of that name
services:
  todoh:
    build: ..
    env_file: .env
    environment:
      EVENTMATE_MODE: shared
    volumes: [todoh-data:/data]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s   # the server drains in-flight requests on SIGTERM (up to 20 s)
    expose: ["8000"]
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus/owner_token:/etc/prometheus/owner_token:ro
      - prom-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.0
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/todoh.json:ro
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
volumes: {todoh-data: {}, prom-data: {}}
