name: nightly
# The long runs: the whole gate again (every Python, the full browser matrix is part of the suite) and the 1800-second, 20-visitor soak before-a-release uses.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_OUT: /tmp/todoh-ci-out  # one job, one runner: a fixed place, so the upload steps can name the files

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  soak-long:
    name: soak-1800s
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
        with:
          browsers: "false"
      - uses: ./.github/actions/build-solvers
      - run: make ci-soak
        env:
          SOAK_SECONDS: "1800"
          SOAK_VISITORS: "20"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soak-report-1800s
          path: /tmp/todoh-ci-out/soak.json
          if-no-files-found: ignore
