name: live-evals
# Run by hand only (Actions tab -> live-evals); never on push. Needs the repository secret OPENROUTER_API_KEY (and optionally NVIDIA_API_KEY), on a FREE model route. The run stops at max_calls
# model calls and a cut-short run is never a pass. It writes the result as an artefact; it never changes the prompt lock (a deliberate local step:
# python -m eventmate.assistant.evals --update-lock --behavioral).
on:
  workflow_dispatch:
    inputs:
      max_calls:
        description: Stop between cases after this many model calls
        default: "120"

permissions:
  contents: read

concurrency:
  group: live-evals
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
        with:
          browsers: "false"
      - uses: ./.github/actions/solvers
      - name: Behavioural evals against the real model
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MAX_CALLS: ${{ inputs.max_calls }}
        run: python -m eventmate.assistant.evals --behavioral --require-behavioral --max-calls "$MAX_CALLS" | tee behavioral.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: live-eval-results
          path: behavioral.txt
          if-no-files-found: ignore
