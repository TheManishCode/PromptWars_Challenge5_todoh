name: ci
# One gate, the same one `make ci` runs on a laptop: each job calls a tools/ci script. Required checks for branch protection: see docs/CI.md (the single check "ci-gate" depends on all of them).
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CI_OUT: /tmp/todoh-ci-out  # one job, one runner: a fixed place, so the upload steps can name the files

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # the secret scan reads the whole history
          persist-credentials: false
      - uses: ./.github/actions/prepare
        with:
          browsers: "false"
      - run: make ci-static

  ui:
    name: ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: make ci-ui

  solvers:
    name: solvers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-solvers
      - run: tools/ci/solvers.sh pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solvers
          path: /tmp/todoh-ci-out/solvers.tar
          retention-days: 7

  tests:
    name: tests (py${{ matrix.python }})
    needs: solvers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    env:
      HYPOTHESIS_PROFILE: ci  # derandomised: a failing property is reproducible from the log
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
        with:
          python-version: ${{ matrix.python }}
      - uses: ./.github/actions/build-solvers
      - name: The suite, the skip guard and the clean-tree check (coverage on the newest Python only)
        env:
          COVERAGE: ${{ matrix.python == '3.14' && '1' || '' }}
        run: make ci-tests
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-py${{ matrix.python }}
          path: |
            /tmp/todoh-ci-out/junit.xml
            /tmp/todoh-ci-out/coverage.xml
            /tmp/todoh-ci-out/*.log
          if-no-files-found: ignore

  mutants:
    name: mutants
    needs: solvers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - uses: ./.github/actions/build-solvers
      - run: make ci-mutants

  deploy-check:
    name: deploy-check
    needs: solvers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - run: make ci-deploy-check

  soak:
    name: soak
    needs: solvers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
        with:
          browsers: "false"
      - uses: ./.github/actions/build-solvers
      - run: make ci-soak
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soak-report
          path: /tmp/todoh-ci-out/soak.json
          if-no-files-found: ignore

  ci-gate:
    name: ci-gate
    if: always()
    needs: [static, ui, solvers, tests, mutants, deploy-check, soak]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job must have succeeded (a skipped or cancelled one is not a pass)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "a job did not succeed: $r"; exit 1; }; done
