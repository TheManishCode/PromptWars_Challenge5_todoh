<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="480" viewBox="0 0 1240 480" role="img" aria-label="Plan flow: brief, intake, shortlist, schedule, symbolic check, validator, plan version"><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker><marker id="a34d399" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker><marker id="af472b6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f472b6"/></marker><marker id="afbbf24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker></defs><rect width="1240" height="480" rx="24" fill="#0b1020"/><text x="620" y="38" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#e2e8f0" font-weight="700">From a plain-language brief to a plan you can trust</text><rect x="30" y="70" width="170" height="90" rx="14" fill="#111a33" stroke="#6366f1" stroke-width="2"/><text x="115.0" y="100.9" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#e2e8f0" font-weight="700">1  Your brief</text><text x="115.0" y="119.9" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#e2e8f0">Guests, city, date,</text><text x="115.0" y="138.9" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#e2e8f0">budget, wishes</text><rect x="230" y="70" width="170" height="90" rx="14" fill="#111a33" stroke="#6366f1" stroke-width="2"/><text x="315.0" y="100.9" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fi