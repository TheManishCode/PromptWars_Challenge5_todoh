xt><text x="915.0" y="119.9" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#e2e8f0">Fast Downward + VAL</text><text x="915.0" y="138.9" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#e2e8f0">confirm feasibility</text><line x1="200" y1="115" x2="230" y2="115" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a94a3b8)"/><line x1="400" y1="115" x2="430" y2="115" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a94a3b8)"/><line x1="600" y1="115" x2="630" y2="115" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a94a3b8)"/><line x1="800" y1="115" x2="830" y2="115" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a94a3b8)"/><rect x="1030" y="55" width="190" height="120" rx="14" fill="#111a33" stroke="#34d399" stroke-width="2"/><text x="1125.0" y="100.9" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#e2e8f0" font-weight="700">6  Validator</text><text x="1125.0" y="119.9" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#e2e8f0">Re-derives every fact</text><text x="1125.0" y="138.9" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#e2e8f0">from the database</text><line x1="1000" y1="115" x2="1030" y2="115" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#a94a3b8)"/><line x1="1125" y1="175" x2="1125" y2="235" stroke="#34d399" stroke-width="2.2" marker-end="url(#a34d399)"/><text x="1131.0" y="199.0" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#34d399">passes</text><line x1="1060" y1="175" x2="850" y2="262" stroke="#f472b6" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#af472b6)"/><text x="961.0" y="212.5" font-family="ui-sans-serif,system-ui,Segoe UI,Helveti