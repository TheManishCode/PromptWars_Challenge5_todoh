 stroke="#34d399" stroke-width="2"/><text x="690.0" y="267.9" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#e2e8f0" font-weight="700">OR-Tools CP-SAT</text><rect x="580" y="294" width="220" height="46" rx="14" fill="#111a33" stroke="#34d399" stroke-width="2"/><text x="690.0" y="321.9" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#e2e8f0" font-weight="700">Fast Downward + VAL</text><rect x="290" y="375" width="250" height="80" rx="14" fill="#111a33" stroke="#34d399" stroke-width="2"/><text x="415.0" y="401.6" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e2e8f0" font-weight="700">Plan store</text><text x="415.0" y="419.6" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e2e8f0">immutable, hash-checked,</text><text x="415.0" y="437.6" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e2e8f0">one per workspace</text><rect x="580" y="375" width="220" height="80" rx="14" fill="#111a33" stroke="#34d399" stroke-width="2"/><text x="690.0" y="410.6" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e2e8f0" font-weight="700">Pricing + budget ledger</text><text x="690.0" y="428.6" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e2e8f0">quotes with provenance</text><rect x="60" y="375" width="190" height="80" rx="14" fill="#0f2a22" stroke="#34d399" stroke-width="2"/><text x="155.0" y="401.6" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e2e8f0" font-weight="700">Validator</text><text x="155.0" y="419.6" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e2e8f0">no valid plan,</text><text x="155.0" y="437.6" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e2e8f0">no plan version</text><rect x="60" y="480" width="740" height="62" rx="14" fill="#111a33" stroke="#475569" stroke-width="2"/><text x="430.0" y="515.5" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e2e8f0">Per-workspace isolation, rate limits, untrusted-input guards, Langfuse traces, Prometheus metrics</text><rect x="860" y="190" width="350" height="185" rx="20" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="7 6"/><text x="878" y="216" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fbbf24" letter-spacing="0.5">GENAI  -  wording only</text><rect x="885" y="222" width="300" height="56" rx="14" fill="#111a33" stroke="#fbbf24" stroke-width="2"/><text x="1035.0" y="245.6" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e2e8f0" font-weight="700">Intake, Ideas, Explainer,</text><text x="1035.0" y="263.6" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e2e8f0">Assistant, Explore</text><rect x="885" y="285" width="300" height="70" rx="14" fill="#111a33" stroke="#fbbf24" stroke-width="2"/><text x="1035.0" y="315.6" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e2e8f0" font-weight="700">Guards</text><text x="1035.0" y="333.6" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#e2e8f0">no invented prices, vendors or availability</text><rect x="860" y="395" width="350" height="175" rx="20" fill="n